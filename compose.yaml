name: torobticket
services:
  database:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: torobticket
      POSTGRES_USER: torobticket
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U torobticket -d torobticket']
      interval: 2s
      timeout: 3s
      retries: 30
  initializer:
    image: ${COMPOSE_PROJECT_NAME:-torobticket}-initializer:packaged
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        NPM_REGISTRY: ${TOROBTICKET_NPM_REGISTRY:-https://registry.npmjs.org}
        PRISMA_ENGINES_MIRROR: ${TOROBTICKET_PRISMA_ENGINES_MIRROR:-https://binaries.prisma.sh}
        TOROBTICKET_PUBLIC_ORIGIN: ${TOROBTICKET_PUBLIC_ORIGIN:-}
      target: initializer
    environment:
      DATABASE_URL: postgresql://torobticket:local-demo-only@database:5432/torobticket
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'
  api:
    image: ${COMPOSE_PROJECT_NAME:-torobticket}-api:packaged
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        NPM_REGISTRY: ${TOROBTICKET_NPM_REGISTRY:-https://registry.npmjs.org}
        PRISMA_ENGINES_MIRROR: ${TOROBTICKET_PRISMA_ENGINES_MIRROR:-https://binaries.prisma.sh}
        TOROBTICKET_PUBLIC_ORIGIN: ${TOROBTICKET_PUBLIC_ORIGIN:-}
      target: api
    environment:
      DATABASE_URL: postgresql://torobticket:local-demo-only@database:5432/torobticket
      TOROBTICKET_LOCAL_REVIEW: ${TOROBTICKET_LOCAL_REVIEW:-true}
      TOROBTICKET_REVIEWER_ACTIVITY: ${TOROBTICKET_REVIEWER_ACTIVITY:-true}
      TOROBTICKET_SSO_TEST_SMS_CODE: ${TOROBTICKET_SSO_TEST_SMS_CODE:-123456}
      TOROBTICKET_SSO_ORIGIN: ${TOROBTICKET_SSO_ORIGIN:-http://localhost:${TOROBTICKET_PORT:-4300}}
      TOROBTICKET_ADMIN_ORIGIN: ${TOROBTICKET_ADMIN_ORIGIN:-}
      TOROBTICKET_ADMIN_PORT: ${TOROBTICKET_ADMIN_PORT:-4301}
      TOROBTICKET_EXAMPLE_PROVIDER_ORIGIN: ${TOROBTICKET_EXAMPLE_PROVIDER_ORIGIN:-}
      TOROBTICKET_EXAMPLE_PROVIDER_PORT: ${TOROBTICKET_EXAMPLE_PROVIDER_PORT:-4310}
      TOROBTICKET_EXAMPLE_PROVIDER_INTERNAL_ORIGIN: http://example-provider:4310
    depends_on:
      initializer:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, infra/healthcheck.mjs]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  example-provider:
    image: ${COMPOSE_PROJECT_NAME:-torobticket}-example-provider:packaged
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: example-provider
      args:
        NPM_REGISTRY: ${TOROBTICKET_NPM_REGISTRY:-https://registry.npmjs.org}
        PRISMA_ENGINES_MIRROR: ${TOROBTICKET_PRISMA_ENGINES_MIRROR:-https://binaries.prisma.sh}
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      TOROBTICKET_SSO_ORIGIN: ${TOROBTICKET_SSO_ORIGIN:-http://localhost:${TOROBTICKET_PORT:-4300}}
      TOROBTICKET_EXAMPLE_PROVIDER_ORIGIN: ${TOROBTICKET_EXAMPLE_PROVIDER_ORIGIN:-}
      TOROBTICKET_EXAMPLE_PROVIDER_PORT: ${TOROBTICKET_EXAMPLE_PROVIDER_PORT:-4310}
      TOROBTICKET_ISSUER_INTERNAL_ORIGIN: http://api:4302
      TOROBTICKET_PROVIDER_STORE: /data/provider.json
    ports:
      - '127.0.0.1:${TOROBTICKET_EXAMPLE_PROVIDER_PORT:-4310}:4310'
    volumes:
      - example_provider:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4310/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s
  web:
    image: ${COMPOSE_PROJECT_NAME:-torobticket}-web:packaged
    build:
      context: .
      dockerfile: infra/Dockerfile.frontends
      target: web
      args:
        NPM_REGISTRY: ${TOROBTICKET_NPM_REGISTRY:-https://registry.npmjs.org}
        PRISMA_ENGINES_MIRROR: ${TOROBTICKET_PRISMA_ENGINES_MIRROR:-https://binaries.prisma.sh}
        TOROBTICKET_PUBLIC_ORIGIN: ${TOROBTICKET_PUBLIC_ORIGIN:-}
    environment:
      TOROBTICKET_SSO_ORIGIN: ${TOROBTICKET_SSO_ORIGIN:-http://localhost:${TOROBTICKET_PORT:-4300}}
      TOROBTICKET_ADMIN_ORIGIN: ${TOROBTICKET_ADMIN_ORIGIN:-}
      TOROBTICKET_ADMIN_PORT: ${TOROBTICKET_ADMIN_PORT:-4301}
    ports:
      - '127.0.0.1:${TOROBTICKET_PORT:-4300}:4300'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:4300/api/health/ready']
      interval: 2s
      timeout: 5s
      retries: 30
  admin:
    image: ${COMPOSE_PROJECT_NAME:-torobticket}-admin:packaged
    build:
      context: .
      dockerfile: infra/Dockerfile.frontends
      target: admin
      args:
        NPM_REGISTRY: ${TOROBTICKET_NPM_REGISTRY:-https://registry.npmjs.org}
        PRISMA_ENGINES_MIRROR: ${TOROBTICKET_PRISMA_ENGINES_MIRROR:-https://binaries.prisma.sh}
    environment:
      TOROBTICKET_SSO_ORIGIN: ${TOROBTICKET_SSO_ORIGIN:-http://localhost:${TOROBTICKET_PORT:-4300}}
      TOROBTICKET_ADMIN_ORIGIN: ${TOROBTICKET_ADMIN_ORIGIN:-}
      TOROBTICKET_ADMIN_PORT: ${TOROBTICKET_ADMIN_PORT:-4301}
    ports:
      - '127.0.0.1:${TOROBTICKET_ADMIN_PORT:-4301}:4301'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:4301/admin/']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  database:
  example_provider:
